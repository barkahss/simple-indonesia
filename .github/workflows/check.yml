name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python evals/id_lint.py --self-test
      - run: node --test src/hooks/simple-indonesia-activate.test.js
      - run: python src/hooks/test_lint_hook.py
      - run: python evals/check_examples.py
      - run: python evals/run_eval.py --check
